# unworkspacified because support currently is shoddy

[workspace]
members = [
    "CreuSAT",
    "Robinson",
    "Friday",
    "JigSAT",
    "Scratch",
    "tests",
    "NewDB",
]
resolver = "2"

[workspace.dependencies]
creusot-std = { git = "https://github.com/creusot-rs/creusot/", package = "creusot-std", version = "0.10.0-dev" }
# creusot-std.path = "../creusot/creusot-std"
[profile.release]
debug = false
#split-debuginfo = ?
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
incremental = false
rpath = false

[profile.bench]
debug = false
lto = true
opt-level = 3

[profile.test]
debug = false
lto = true
opt-level = 3

[workspace.metadata.creusot]
default-members = ["CreuSAT", "Robinson", "Friday"]
